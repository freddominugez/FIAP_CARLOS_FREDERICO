# Ambiente local completo: PostgreSQL + API.
# Uso: docker compose up --build   (API em http://localhost:3000, Swagger em /api/docs)
# Valores abaixo são só para desenvolvimento local. Em produção, variáveis vêm do painel da Vercel.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina-local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://oficina:oficina-local@db:5432/oficina
      DATABASE_POOL_MAX: 5
      JWT_SECRET: troque-este-segredo-local-de-desenvolvimento-32
      JWT_EXPIRES_IN: 1h
      SEED_DEMO: "true"
      LOG_LEVEL: info
    ports:
      - "3000:3000"

volumes:
  pgdata:
